; IVR de turnos — plantilla de dialplan
; Interno variable: __IVR_EXTEN__ (por defecto 8000; cambiarlo al instalar)
; Tecla 1 = desvio al telefono del destino de hoy (AstDB farmacias/hoy_tel)
; Compatible con Asterisk 11 (Issabel / CentOS 7)
; Destino personalizado Issabel: farmacia-turno,s,1

[farmacia-turno]
exten => s,1,Goto(__IVR_EXTEN__,1)

exten => __IVR_EXTEN__,1,NoOp(IVR-turnos anuncio del dia)
 same => n,Set(CHANNEL(language)=es)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(FARMACIA=${DB(farmacias/hoy)})
 same => n,Set(TELEFONO=${DB(farmacias/hoy_tel)})
 same => n,GotoIf($["${FARMACIA}" = ""]?sin_dato)
 same => n,GotoIf($["${FARMACIA}" = "fallback"]?sin_dato)
 same => n,GotoIf($["${STAT(e,/var/lib/asterisk/sounds/es/farmacias/${FARMACIA}.wav)}" = "0"]?sin_dato)
 same => n,Playback(farmacias/intro)
 same => n,Playback(farmacias/${FARMACIA})
 same => n,GotoIf($["${TELEFONO}" = ""]?fin)
 same => n,GotoIf($["${STAT(e,/var/lib/asterisk/sounds/es/farmacias/opcion1.wav)}" = "0"]?espera)
 same => n,Background(farmacias/opcion1)
 same => n,WaitExten(8)
 same => n(espera),WaitExten(8)
 same => n(fin),Hangup()

 same => n(sin_dato),Playback(farmacias/fallback)
 same => n,Hangup()

exten => 1,1,NoOp(IVR-turnos desvio tecla 1)
 same => n,GotoIf($["${TELEFONO}" = ""]?nodial)
 same => n,Dial(Local/${TELEFONO}@from-internal/n,60)
 same => n(nodial),Hangup()

exten => i,1,Hangup()
exten => t,1,Hangup()

; include => farmacia-turno  en from-internal-custom
