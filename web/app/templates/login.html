<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · {{ system_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <p class="brand-kicker">Central IP</p>
    <h1>{{ system_name }}</h1>
    <p class="login-lead">Turnos de farmacia: cargá farmacias, calendario y audios sin tocar Asterisk a mano.</p>
    {% if flash %}
    <p class="banner {{ flash.tipo }}">{{ flash.mensaje }}</p>
    {% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
    <label>Usuario
      <input name="usuario" value="admin" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input name="clave" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
    <p class="hint">Por defecto: <code>admin</code> / <code>admin</code></p>
  </form>
</body>
</html>
